<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Letter ❤️</title>

    <style>
        body {
            margin: 0;
            background: #ffe6eb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .letter-box {
            width: 80%;
            max-width: 500px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 10;
        }

        #letter {
            white-space: pre-wrap;   /* IMPORTANT */
            font-size: 22px;
            line-height: 1.7;
        }

        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            color: red;
            animation: floatUp linear forwards;
        }

        @keyframes floatUp {
            from {
                transform: translateY(100vh);
                opacity: 1;
            }
            to {
                transform: translateY(-100px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="hearts"></div>

    <div class="letter-box">
        <div id="letter"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
